# SonarQube analysis configuration for architecture-deck-system
# Server-side project key: "architecture-deck-system"
#
# Secrets are NOT stored in this file. Provide these at scan time instead:
#   sonar.host.url  -> http://localhost:9000 (from host) / http://host.docker.internal:9000 (from a container)
#   sonar.token     -> env SONAR_TOKEN or -Dsonar.token=...   (NEVER commit a token)

sonar.projectKey=architecture-deck-system
sonar.projectName=Architecture Deck System
# Sources scoped to real code (keeps generated/static trees out of metrics).
sonar.sources=src,scripts
sonar.sourceEncoding=UTF-8

# Test code is excluded from the coverage denominator so new-code coverage
# reflects production lines only. Storybook stories are not measured.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/*.stories.tsx,**/*.stories.ts

# Defensive exclusions (sources are already scoped to src,scripts).
sonar.exclusions=**/node_modules/**,**/dist/**,**/storybook-static/**,**/.scannerwork/**,**/*.min.js

# Coverage report (optional; generate with: npm run test -- --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.scm.disabled=true
