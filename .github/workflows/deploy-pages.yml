name: Deploy to GitHub Pages

# Publishes the static landing page (docs/) plus a built React deck viewer
# under /demo/. The landing page mirrors the pattern used by sibling portfolio
# repos while the demo gives reviewers a one-click product surface.
#
# To activate: repo Settings → Pages → Source = "GitHub Actions".

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least-privilege token scoped for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # `enablement: true` asks the API to create the Pages site (build_type
      # "workflow") if it doesn't exist yet. NOTE: per actions/configure-pages'
      # own action.yml, this requires a token other than the default
      # GITHUB_TOKEN (a PAT with `repo` scope, or a GitHub App token with
      # `administration:write` + `pages:write`) — the auto-generated
      # GITHUB_TOKEN cannot create a Pages site regardless of the
      # `permissions:` block above. If Pages has never been enabled for this
      # repo, a one-time manual step is still required: Settings → Pages →
      # Build and deployment → Source: "GitHub Actions". This flag is kept on
      # so the workflow self-heals if a PAT is ever wired in via `with: token:`.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build demo viewer
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-site/demo
          cp -R docs/. pages-site/
          cp -R dist/. pages-site/demo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: pages-site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
