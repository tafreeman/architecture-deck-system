name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Build · Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Verify layout registry count
        run: npm run verify:layouts

      - name: Build (Vite)
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright Chromium
        # Normally ~30s; retry with a per-attempt cap so a transient apt/CDN
        # stall fails fast and retries instead of hanging the whole job.
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed/timed out; retrying after 5s"
            sleep 5
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      - name: Export deck artifacts
        run: npm run export:all

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

      - name: Upload exported deck artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exported-deck
          path: single-file/
          retention-days: 7
