name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: fast correctness checks ─────────────────────────────────────────
  # typecheck + lint + tests + vite build.  Tight timeout so regressions fail
  # fast instead of burning the full runner hour.
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Verify layout registry count
        run: npm run verify:layouts

      - name: Build (Vite)
        run: npm run build

      # Fast single-file export smoke — Vite build + node bundler, NO Playwright.
      # Runs on PRs (and main) so export breakage is caught at review time without
      # paying the Playwright/browser cost of the full `export:all` job below.
      - name: Export smoke (single-file HTML)
        run: npm run export:html

  # ── Job 2: Storybook build (runs in parallel with job 1) ───────────────────
  # Isolated so a slow Storybook build never blocks the correctness checks, and
  # a tight timeout exposes future regressions quickly.
  #
  # Root-cause fixes applied here (and in .storybook/main.js + package.json):
  #   • STORYBOOK_DISABLE_TELEMETRY=1 — prevents outbound HTTP calls to the
  #     Storybook telemetry service that can hang on restricted CI networks.
  #   • addon-onboarding removed from main.js — it injects an interactive
  #     first-run prompt that waits for stdin that never arrives in CI.
  #   • --disable-telemetry --quiet added to the build-storybook npm script as
  #     belt-and-suspenders (env var + CLI flag + config.core.disableTelemetry).
  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Belt-and-suspenders: also set at the env level in case any Storybook
      # pre-build hook reads process.env before the CLI flag is parsed.
      STORYBOOK_DISABLE_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  # ── Job 3: deck export (main-push only, needs ci to pass first) ────────────
  # Playwright-driven HTML/image/PDF export.  Unchanged from original; already
  # completes well within limits.  Gated to main-push to avoid wasting Playwright
  # minutes on every PR.
  export:
    name: Export Deck Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
          save-always: true

      - name: Install Playwright Chromium system deps
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Export deck artifacts
        run: npm run export:all

      - name: Upload exported deck artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: exported-deck
          path: single-file/
          retention-days: 7
