version: 2
updates:
  # ── npm dependencies ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    ignore:
      # Avoid auto-major churn on Playwright — majors often need export-script
      # and browser-pin updates handled deliberately, not by bot.
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
      # Storybook majors are large, breaking migrations — pin to non-major bumps.
      - dependency-name: "storybook"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  # Keeps the SHA-pinned actions in .github/workflows/ up to date automatically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
